<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>语伴 · 在线词库</title>
<style>
  body { margin: 0; padding: 32px 20px; font: 15px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1F2430; background: #F5F7FB; }
  .card { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 6px 24px rgba(31, 36, 48, .08); }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { color: #8A94A6; font-size: 13px; margin-bottom: 20px; }
  dl { display: grid; grid-template-columns: 96px 1fr; gap: 8px 12px; margin: 0; }
  dt { color: #8A94A6; font-size: 13px; }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  code { background: #F1F4FA; padding: 2px 6px; border-radius: 6px; font-size: 13px; }
  .ok { color: #16A34A; } .bad { color: #DC2626; }
  .tip { margin-top: 20px; padding-top: 16px; border-top: 1px solid #EEF1F7; color: #8A94A6; font-size: 13px; }
</style>
</head>
<body>
<div class="card">
  <h1>语伴 · 在线词库</h1>
  <div class="sub">这个地址供小程序启动时拉取素材；本身就是一份静态 JSON。</div>
  <dl>
    <dt>状态</dt><dd id="state">检查中…</dd>
    <dt>版本号</dt><dd id="version">—</dd>
    <dt>文件大小</dt><dd id="bytes">—</dd>
    <dt>英语</dt><dd id="en">—</dd>
    <dt>日语</dt><dd id="ja">—</dd>
    <dt>数据文件</dt><dd><code id="file">data.json</code></dd>
  </dl>
  <div class="tip">
    小程序里把 <code>utils/online-data.js</code> 的 <code>DATA_URLS</code> 设为这个域名下的 <code>/data.json</code>，
    并在小程序后台把域名加进 <b>request 合法域名</b>。真机要求域名已 ICP 备案。
  </div>
</div>
<script>
  fetch('data.json', { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status)
    return r.json()
  }).then(function (d) {
    var w = d.words || {}, s = d.sentences || {}, g = d.dialogues || {}
    function n(a) { return Array.isArray(a) ? a.length : 0 }
    document.getElementById('state').innerHTML = '<span class="ok">✅ 数据可读</span>'
    document.getElementById('version').textContent = d.version || '—'
    // 版本号是内容指纹（c+sha1 前 13 位）：词库没改就不变，客户端不会白拉
    fetch('data.json', { method: 'HEAD' }).then(function (r) {
      const n = Number(r.headers.get('content-length') || 0)
      document.getElementById('bytes').textContent = n ? (n / 1024).toFixed(0) + ' KB' : '—'
    }).catch(function () {})
    document.getElementById('en').textContent = n(w.en) + ' 词 / ' + n(s.en) + ' 句 / ' + n(g.en) + ' 组对话'
    document.getElementById('ja').textContent = n(w.ja) + ' 词 / ' + n(s.ja) + ' 句 / ' + n(g.ja) + ' 组对话'
  }).catch(function (e) {
    document.getElementById('state').innerHTML = '<span class="bad">❌ 读取失败：' + e.message + '</span>'
  })
</script>
</body>
</html>
